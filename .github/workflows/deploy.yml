name: Deploy to Zoho Catalyst

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build
          cp public/client-package.json dist/client-package.json

      - name: Deploy to Catalyst
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        run: catalyst deploy --token "$CATALYST_TOKEN"
